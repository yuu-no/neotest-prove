name: CI

on:
  push:
    branches: [main, master]
  pull_request: ~

jobs:
  style:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua tests

  perl:
    name: perl helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run helper tests
        run: prove -v perl/t

  lua:
    name: lua tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install test dependencies
        run: |
          deps=.tests/site/pack/deps/start
          mkdir -p "$deps"
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim "$deps/plenary.nvim"
          git clone --depth 1 https://github.com/nvim-neotest/nvim-nio "$deps/nvim-nio"
          git clone --depth 1 https://github.com/nvim-neotest/neotest "$deps/neotest"
          git clone --depth 1 --branch main \
            https://github.com/nvim-treesitter/nvim-treesitter "$deps/nvim-treesitter"
      - name: Install the perl treesitter parser
        run: |
          nvim --headless -u tests/minimal_init.lua \
            -c "lua require('nvim-treesitter').install({ 'perl' }):await(function() vim.cmd('qa!') end)" \
            || echo "parser install failed; discovery tests will be skipped"
      - name: Run tests
        run: ./scripts/test
